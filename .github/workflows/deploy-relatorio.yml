name: Deploy relatório

# Publica o site estático website/ no GitHub Pages -- specs/2026-09-24_website_refactor §4.10.
# Desde specs/2026-11-05_versao_final_site (R8): automático a cada push na `main` (a branch publicada; `staging_main`
# é a de teste -- constituição §7), mais o gatilho manual. O CI NÃO gera nada: website/ já vem gerado e versionado
# (o gerador precisa de tabelas_finais/, que é gitignorado). O PDF não passa por aqui: vai como anexo de uma Release.
on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/deploy-relatorio.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Evita dois deploys concorrentes pisando um no outro; não cancela um deploy em
# andamento por um novo disparo (espera terminar).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # Lista de INCLUSÃO (não de exclusão): só o que o site usa. build/ (gerador Python),
      # README.md e ROADMAP.md ficam de fora sem depender de ninguém lembrar.
      # A mesma lista está em website/build/confere_publicacao.py (INCLUI).
      - name: Prepara o site
        run: |
          mkdir -p _site
          cp website/index.html website/404.html website/.nojekyll website/favicon.ico _site/
          cp -r website/css website/js website/data website/assets _site/

      # Tipos de arquivo permitidos, orçamento de tamanho, sem lorem, sem fetch(), e dado pontual só com a faixa
      # EM DESENVOLVIMENTO (constituição §3) -- falha e bloqueia o deploy.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Confere o conteúdo publicado
        run: python website/build/confere_publicacao.py _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
