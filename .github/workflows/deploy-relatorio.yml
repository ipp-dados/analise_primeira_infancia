name: Deploy relatório

# Publica o site estático website/ no GitHub Pages -- specs/2026-09-24_website_refactor §4.10
# (antes: só relatorio/index.html, specs/2026-09-14_relatorio-interativo/plan.md §8).
# Gatilho manual (workflow_dispatch). O CI NÃO gera nada: website/ já vem gerado e
# versionado (o gerador precisa de tabelas_finais/, que é gitignorado).
on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Evita dois deploys concorrentes pisando um no outro; não cancela um deploy em
# andamento por um novo disparo (espera terminar).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Lista de INCLUSÃO (não de exclusão): só o que o site usa. build/ (gerador Python,
      # protótipo), README.md e ROADMAP.md ficam de fora sem depender de ninguém lembrar.
      - name: Prepara o site
        run: |
          mkdir -p _site
          cp website/index.html website/404.html website/.nojekyll _site/
          cp -r website/css website/js website/data website/assets _site/

      # Site estático de verdade (spec §4.10): falha se aparecer qualquer tipo de arquivo
      # fora da lista (ex. um .py ou .md copiado por engano).
      - name: Confere o conteúdo publicado
        run: |
          fora=$(find _site -type f ! -name '.nojekyll' ! -regex '.*\.\(html\|css\|js\|svg\|png\|jpg\)$')
          if [ -n "$fora" ]; then echo "Arquivos fora do permitido:"; echo "$fora"; exit 1; fi
          echo "Conteúdo OK: $(find _site -type f | wc -l) arquivos, $(du -sh _site | cut -f1)"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
